<!DOCTYPE html>
<html>
<head>
    <!-- Add title for the browser tab -->
    <title>Side Quests - Login</title>

    <style>
        /* Basic page styling */
        body {
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Login box */
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Space under the "Side Quests" title */
        h1 {
            margin-bottom: 20px;
        }

        /* Style for input boxes */
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* Login button styling */
        button {
            width: 320px;
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Lighter gray on hover */
        button:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <!-- Login box -->
    <div class="login-box">
        <h1>Side Quests</h1>

        <!-- Username input field -->
        <input type="text" id="username" placeholder="Username">

        <!-- Password input field -->
        <input type="password" id="password" placeholder="Password">

        <!-- Login button that redirects to home.html -->
        <button onclick="login()">Login</button>
    </div>

    <script>
        function login() {
            window.location.href = "home.html";
        }
    </script>
</body>
</html>
